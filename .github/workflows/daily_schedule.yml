name: South COD Monitor - Daily Schedule

on:
  schedule:
    # Run daily at 1:00 PM IST (7:30 AM UTC)
    # Cron format: minute hour day month day-of-week
    # IST is UTC+5:30, so 1 PM IST = 7:30 AM UTC
    - cron: '30 7 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_south_cod_monitor.txt
    
    - name: Setup Chrome for WhatsApp image conversion
      id: chrome
      uses: browser-actions/setup-chrome@v2
      with:
        install-chromedriver: true
        install-dependencies: true
    
    - name: Create service account key file
      env:
        SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON || secrets.SERVICE_ACCOUNT_KEY }}
      run: |
        echo "$SERVICE_ACCOUNT_JSON" > service_account_key.json
        if [ -f service_account_key.json ]; then
          echo "Service account key created"
        else
          echo "ERROR: Service account key not created"
          exit 1
        fi
    
    - name: Run South COD Monitor
      env:
        GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
        WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        HTML_TO_IMAGE_SERVICE_URL: ${{ secrets.HTML_TO_IMAGE_SERVICE_URL }}
        CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        python South_COD_Monitor.py
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs
        path: |
          *.log
          *.xlsx
        retention-days: 7

